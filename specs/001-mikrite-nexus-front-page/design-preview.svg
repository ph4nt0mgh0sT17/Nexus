<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Mikrite Nexus front page, desktop preview (dark theme)</title>
  <desc id="desc">Header with the node mark and wordmark, a hero with the title and a short description, and three application cards: a live application, a preview with a mock-up, and an unavailable application.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#343a4f"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="20%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1280" height="500" fill="url(#fade)"/>
    </mask>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f3f8"/>
      <stop offset="1" stop-color="#c39bf0"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd9e6"/>
      <stop offset="1" stop-color="#7fd9e6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Page background and faint dot grid behind the hero -->
  <rect width="1280" height="800" fill="#111522"/>
  <rect width="1280" height="500" fill="url(#dots)" mask="url(#fadeMask)" opacity="0.6"/>

  <!-- Header: node mark and wordmark -->
  <g transform="translate(64 56)">
    <g stroke="#7fd9e6" stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="18" y2="-16"/>
      <line x1="0" y1="0" x2="18" y2="16"/>
      <line x1="0" y1="0" x2="-18" y2="-16"/>
      <line x1="0" y1="0" x2="-18" y2="16"/>
    </g>
    <circle r="7" fill="#7fd9e6"/>
    <circle cx="18" cy="-16" r="4" fill="#111522" stroke="#7fd9e6" stroke-width="2"/>
    <circle cx="18" cy="16" r="4" fill="#111522" stroke="#7fd9e6" stroke-width="2"/>
    <circle cx="-18" cy="-16" r="4" fill="#111522" stroke="#7fd9e6" stroke-width="2"/>
    <circle cx="-18" cy="16" r="4" fill="#111522" stroke="#7fd9e6" stroke-width="2"/>
  </g>
  <text x="104" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f1f3f8" letter-spacing="-0.2">Mikrite Nexus</text>

  <!-- Hero: title and description -->
  <text x="64" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="750" fill="#f1f3f8" letter-spacing="-3.5">Mikrite</text>
  <text x="64" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="750" fill="url(#titleGrad)" letter-spacing="-3.5">Nexus</text>
  <text x="64" y="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#a3a9bd">The hub that leads to every application in the ecosystem.</text>
  <text x="64" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#a3a9bd">Choose an application below to get started.</text>

  <!-- Section label -->
  <text x="64" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a3a9bd" letter-spacing="1.2">APPLICATIONS</text>

  <!-- Card 1: live application (accent spoke, hover state not shown) -->
  <g transform="translate(64 520)">
    <rect width="370" height="230" rx="16" fill="#1b2030" stroke="#343a4f" stroke-width="1"/>
    <rect x="16" y="0" width="338" height="3" rx="1.5" fill="url(#spoke)"/>
    <rect x="16" y="16" width="338" height="120" rx="10" fill="#111522"/>
    <rect x="34" y="34" width="120" height="10" rx="5" fill="#343a4f"/>
    <rect x="34" y="56" width="290" height="36" rx="6" fill="#262c40"/>
    <rect x="34" y="104" width="90" height="20" rx="6" fill="#7fd9e6" opacity="0.8"/>
    <rect x="236" y="104" width="88" height="20" rx="6" fill="#262c40"/>
    <!-- chip -->
    <rect x="28" y="150" width="58" height="22" rx="11" fill="#7fd9e6" fill-opacity="0.18"/>
    <text x="57" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7fd9e6" letter-spacing="0.8">LIVE</text>
    <text x="28" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="650" fill="#f1f3f8">Tasks</text>
    <text x="28" y="226" font-family="system-ui, sans-serif" font-size="14" fill="#a3a9bd">Plan the day and track what is due.</text>
    <text x="342" y="204" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7fd9e6">Open →</text>
  </g>

  <!-- Card 2: preview with mock-up (not a link) -->
  <g transform="translate(455 520)">
    <rect width="370" height="230" rx="16" fill="#1b2030" stroke="#343a4f" stroke-width="1"/>
    <rect x="16" y="16" width="338" height="120" rx="10" fill="#111522"/>
    <g opacity="0.75">
      <rect x="34" y="34" width="140" height="10" rx="5" fill="#343a4f"/>
      <rect x="34" y="56" width="120" height="36" rx="6" fill="#262c40"/>
      <rect x="164" y="56" width="160" height="36" rx="6" fill="#262c40"/>
      <rect x="34" y="104" width="290" height="20" rx="6" fill="#262c40"/>
    </g>
    <text x="330" y="50" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3a9bd" letter-spacing="0.8">PREVIEW</text>
    <rect x="28" y="150" width="72" height="22" rx="11" fill="#ecc37a" fill-opacity="0.18"/>
    <text x="64" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ecc37a" letter-spacing="0.8">PREVIEW</text>
    <text x="28" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="650" fill="#f1f3f8">Notes</text>
    <text x="28" y="226" font-family="system-ui, sans-serif" font-size="14" fill="#a3a9bd">Quick capture for ideas not ready to be tasks.</text>
    <text x="342" y="204" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a3a9bd">Coming soon</text>
  </g>

  <!-- Card 3: unavailable (muted, not activatable) -->
  <g transform="translate(846 520)" opacity="0.6">
    <rect width="370" height="230" rx="16" fill="#1b2030" stroke="#343a4f" stroke-width="1"/>
    <rect x="16" y="16" width="338" height="120" rx="10" fill="#111522"/>
    <rect x="150" y="60" width="70" height="60" rx="8" fill="none" stroke="#343a4f" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="28" y="150" width="104" height="22" rx="11" fill="#a3a9bd" fill-opacity="0.18"/>
    <text x="80" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3a9bd" letter-spacing="0.8">UNAVAILABLE</text>
    <text x="28" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="650" fill="#f1f3f8">Archive</text>
    <text x="28" y="226" font-family="system-ui, sans-serif" font-size="14" fill="#a3a9bd">Long-term storage for finished work.</text>
    <text x="342" y="204" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a3a9bd">Unavailable</text>
  </g>
</svg>
