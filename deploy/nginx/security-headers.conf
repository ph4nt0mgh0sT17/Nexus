# Security headers for the Nexus front page.
# Included in every location of the server block. Each location that sets its own
# add_header replaces the server-level headers, so the include must be in each one.
# "always" keeps the headers on error responses such as 404.
# Strict-Transport-Security is NOT here: it belongs only in the HTTPS server block.

# The page has no scripts, forms, frames or third-party requests (checked on the built site).
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
