# Nexus front page: nginx server block.
# Used in two places: copied to the server (see DEPLOYMENT.md, "Server requirements")
# and mounted as the default config in local Docker tests (DEPLOYMENT.md, "Testing in Docker").
# The security headers snippet is mounted or copied to /etc/nginx/snippets/security-headers.conf.

server {
    listen 80;
    server_name example.org;            # placeholder: domain not chosen yet
    root /var/www/nexus/current;        # placeholder: symlink to the active release
    index index.html;

    server_tokens off;                  # do not reveal the nginx version

    # Default for the page and its images: revalidate on every load.
    # nginx answers 304 Not Modified when nothing changed, so this stays cheap.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # The stylesheet is hand-edited and its URL does not change, so it is
    # revalidated on every load, the same as the page (research R4).
    location = /style.css {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
